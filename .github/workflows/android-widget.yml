name: Compilar widget Android

on:
  push:
    branches: [main]
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk ../MisCommits.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-v1.${{ github.run_number }}
          name: Mis Commits widget 1.${{ github.run_number }}
          make_latest: true
          files: MisCommits.apk

      # Copia el APK también en la web, para descargarlo desde pascuord.github.io
      - name: Publicar APK en la web
        working-directory: .
        run: |
          mkdir -p commits
          cp MisCommits.apk commits/MisCommits.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commits/MisCommits.apk
          git commit -m "Actualiza MisCommits.apk (versión 1.${{ github.run_number }})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
