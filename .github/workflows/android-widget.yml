name: Compilar widget Android

on:
  push:
    branches: [main]
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk ../MisCommits.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-v1.${{ github.run_number }}
          name: Mis Commits widget 1.${{ github.run_number }}
          make_latest: true
          files: MisCommits.apk
